name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint with flake8
        run: flake8 src tests deployment --max-line-length=100 --extend-ignore=E203

      - name: Check formatting with black
        run: black --check src tests deployment

      - name: Check import order with isort
        run: isort --check-only src tests deployment

      - name: Type check with mypy
        run: mypy src deployment --ignore-missing-imports

      - name: Run unit tests
        run: pytest tests/ -v --cov=src --cov=deployment --cov-report=term-missing
